<g font-size="12.5" fill="#444">
<text x="40" y="965">注 1：I2C 总线（SDA=GPIO8 / SCL=GPIO9）挂 4 个从机地址：0x76 BME280 · 0x68 MPU6050 · 0x3C OLED · 0x40 INA219（预留）；</text>
<text x="40" y="989">　　　SDA/SCL 上拉电阻由各模块板载提供，无需外加。</text>
<text x="40" y="1013">注 2：全部器件 3.3V 供电，由 ESP32-S3 板载 LDO 从 USB 5V 降压输出；锂电池严禁直接接入 3V3 引脚（BME280 上限 3.6V）。</text>
<text x="40" y="1037">注 3：实线为当前固件（fw 0.7.2）已接线并调试通过；虚线为规划中的扩展接口，到货后接入即转实线。</text>
</g>
