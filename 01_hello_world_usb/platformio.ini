[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = dio
monitor_speed = 115200

; 必须开启 monitor_dtr 和 monitor_rts，原生 USB 需要握手信号
monitor_dtr = 1
monitor_rts = 1

; 核心配置：将 Serial 路由至原生 USB (JTAG/Serial debug unit)
build_unflags = 
    -DARDUINO_USB_MODE=1

build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
